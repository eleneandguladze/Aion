<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enzi - Wellness & Supplements</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f9f9f9;
            color: #333;
            line-height: 1.6;
        }

        header {
            background: #ffffff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            list-style: none;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: #555;
            font-weight: 500;
            transition: color 0.3s;
        }

        .mobile-menu-toggle {
            display: none;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #333;
        }

        .main-container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .filters-wrapper {
            margin-bottom: 20px;
        }

        .search-bar {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        /* პროდუქტების ბადე კომპიუტერისთვის */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .product-card {
            background: #ffffff;
            border-radius: 10px;
            padding: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .product-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #2c3e50;
        }

        .product-price {
            font-size: 15px;
            font-weight: bold;
            color: #27ae60;
            margin-bottom: 10px;
        }

        .btn {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            text-align: center;
        }

        /* მობილური ვერსია - მკაცრად 2 სვეტი, გასწორებული ზომები */
        @media screen and (max-width: 768px) {
            .mobile-menu-toggle {
                display: block;
            }

            .nav-links {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 60px;
                left: 0;
                width: 100%;
                background-color: #ffffff;
                box-shadow: 0 4px 6px rgba(0,0,0,0.1);
                padding: 20px;
                gap: 15px;
                text-align: center;
            }

            .nav-links.active {
                display: flex;
            }

            .products-grid {
                grid-template-columns: repeat(2, 1fr); /* ზუსტად 2 სვეტი */
                gap: 10px;
            }

            .product-card {
                padding: 10px;
            }

            .product-card img {
                height: 120px;
            }

            .product-title {
                font-size: 14px;
            }

            .product-price {
                font-size: 14px;
            }

            .btn {
                padding: 8px;
                font-size: 13px;
            }
        }

        /* ძალიან პატარა ეკრანები (მაგ: ძველი სმარტფონები) */
        @media screen and (max-width: 380px) {
            .products-grid {
                grid-template-columns: 1fr; /* 1 სვეტი მხოლოდ ძალიან პატარა ეკრანზე */
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <a href="#" class="logo">Enzi</a>
            <button class="mobile-menu-toggle" onclick="toggleMobileMenu()">☰</button>
            <ul class="nav-links">
                <li><a href="#">მთავარი</a></li>
                <li><a href="#">პროდუქტები</a></li>
                <li><a href="#">კატეგორიები</a></li>
                <li><a href="#">კონტაქტი</a></li>
            </ul>
        </div>
    </header>

    <div class="main-container">
        <div class="filters-wrapper">
            <input type="text" class="search-bar" placeholder="ძებნა პროდუქტებში..." onkeyup="filterProducts(this.value)">
        </div>

        <div class="products-grid" id="productsGrid">
            <div class="product-card">
                <img src="https://via.placeholder.com/300x180" alt="Collagen">
                <div>
                    <div class="product-title">კოლაგენი პეპტიდები</div>
                    <div class="product-price">45.00 ლარი</div>
                </div>
                <button class="btn" onclick="addToCart('კოლაგენი პეპტიდები')">კალათაში</button>
            </div>

            <div class="product-card">
                <img src="https://via.placeholder.com/300x180" alt="Vitamin D3">
                <div>
                    <div class="product-title">ვიტამინი D3</div>
                    <div class="product-price">25.00 ლარი</div>
                </div>
                <button class="btn" onclick="addToCart('ვიტამინი D3')">კალათაში</button>
            </div>

            <div class="product-card">
                <img src="https://via.placeholder.com/300x180" alt="Omega 3">
                <div>
                    <div class="product-title">ომეგა 3 კაფსულები</div>
                    <div class="product-price">35.00 ლარი</div>
                </div>
                <button class="btn" onclick="addToCart('ომეგა 3 კაფსულები')">კალათაში</button>
            </div>
        </div>
    </div>

    <script>
        function toggleMobileMenu() {
            const navLinks = document.querySelector('.nav-links');
            navLinks.classList.toggle('active');
        }

        function addToCart(productName) {
            alert(productName + ' წარმატებით დაემატა კალათაში!');
        }

        function filterProducts(query) {
            const cards = document.querySelectorAll('.product-card');
            query = query.toLowerCase();

            cards.forEach(card => {
                const title = card.querySelector('.product-title').textContent.toLowerCase();
                if (title.includes(query)) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }
    </script>
</body>
</html>
