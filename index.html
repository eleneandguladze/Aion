<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Aion — Food Supplements</title>

<meta name="description" content="Aion Food Supplements — ხარისხიანი საკვები დანამატები ყოველდღიური ჯანმრთელობისა და კეთილდღეობისთვის.">

<!-- Font Awesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- Supabase JS CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
/* =========================================================
AION FOOD SUPPLEMENTS
FRONTEND VERSION
========================================================= */

:root {
--green: #1B4D2E;
--green-dark: #10351F;
--green-light: #71B340;
--sage: #E9EFE9;
--sage-dark: #D0DDD0;
--cream: #F8F6F0;
--white: #FFFFFF;
--text: #26382E;
--muted: #718078;
--border: #E5EAE5;
--sale: #E63946;
--gold: #E5A93D;
--shadow: 0 10px 30px rgba(27, 77, 46, 0.08);
--radius: 20px;
--container: 1180px;
}

* {
box-sizing: border-box;
margin: 0;
padding: 0;
}

html {
scroll-behavior: smooth;
}

body {
font-family:
system-ui,
-apple-system,
BlinkMacSystemFont,
"Segoe UI",
sans-serif;
background: var(--cream);
color: var(--text);
line-height: 1.5;
overflow-x: hidden;
}

body.modal-open {
overflow: hidden;
}

button,
input,
select,
textarea {
font: inherit;
}

button {
cursor: pointer;
}

a {
color: inherit;
text-decoration: none;
}

img {
max-width: 100%;
display: block;
}

.container {
width: min(var(--container), calc(100% - 32px));
margin: 0 auto;
}

/* =========================================================
HEADER
========================================================= */

.header {
position: sticky;
top: 0;
z-index: 900;
background: rgba(255,255,255,.94);
backdrop-filter: blur(16px);
border-bottom: 1px solid rgba(27,77,46,.08);
}

.header-main {
min-height: 76px;
display: flex;
align-items: center;
justify-content: space-between;
gap: 24px;
}

.logo {
flex-shrink: 0;
color: var(--green);
font-size: 27px;
font-weight: 850;
letter-spacing: -1px;
line-height: 1;
}

.logo small {
display: block;
margin-top: 5px;
color: #8F9E8B;
font-size: 7px;
font-weight: 800;
letter-spacing: 3px;
}

.desktop-nav {
display: flex;
align-items: center;
gap: 24px;
font-size: 13px;
font-weight: 650;
color: #516158;
}

.desktop-nav a {
transition: .2s;
}

.desktop-nav a:hover {
color: var(--green);
}

.header-actions {
display: flex;
align-items: center;
gap: 8px;
}

.search-box {
position: relative;
}

.search-input {
width: 180px;
height: 40px;
padding: 0 38px 0 15px;
border: 1px solid var(--border);
border-radius: 22px;
outline: none;
background: var(--cream);
color: var(--text);
font-size: 12px;
transition: .25s;
}

.search-input:focus {
width: 230px;
border-color: var(--sage-dark);
background: white;
}

.search-icon {
position: absolute;
right: 13px;
top: 50%;
transform: translateY(-50%);
color: var(--muted);
pointer-events: none;
}

.header-btn {
position: relative;
width: 40px;
height: 40px;
border: 1px solid var(--border);
border-radius: 50%;
background: white;
color: var(--green);
display: grid;
place-items: center;
font-size: 16px;
transition: .2s;
}

.header-btn:hover {
background: var(--sage);
transform: translateY(-1px);
}

.header-badge {
position: absolute;
top: -3px;
right: -2px;
min-width: 17px;
height: 17px;
padding: 0 4px;
border-radius: 10px;
background: var(--sale);
color: white;
display: grid;
place-items: center;
font-size: 9px;
font-weight: 800;
}

.cart-header-btn {
background: var(--green);
border-color: var(--green);
color: white;
}

.lang-btn {
height: 38px;
padding: 0 12px;
border: 1px solid var(--sage-dark);
border-radius: 20px;
background: var(--sage);
color: var(--green);
font-size: 11px;
font-weight: 800;
}

/* =========================================================
HERO
========================================================= */

.hero {
padding: 20px 0 16px;
}

.hero-grid {
min-height: 320px;
display: grid;
grid-template-columns: 1.05fr .95fr;
gap: 16px;
}

.hero-content {
position: relative;
overflow: hidden;
border-radius: 24px;
padding: clamp(20px, 3vw, 36px);
background:
radial-gradient(circle at 90% 10%, rgba(113,179,64,.22), transparent 30%),
linear-gradient(135deg, #EDF3EC, #F8F6F0);
display: flex;
flex-direction: column;
justify-content: center;
}

.hero-label {
width: fit-content;
margin-bottom: 10px;
padding: 5px 10px;
border-radius: 15px;
background: white;
color: var(--green-light);
font-size: 9px;
font-weight: 850;
letter-spacing: 1px;
text-transform: uppercase;
}

.hero h1 {
max-width: 600px;
color: var(--green);
font-size: clamp(26px, 3.8vw, 42px);
line-height: 1.1;
letter-spacing: -1.5px;
margin-bottom: 10px;
}

.hero p {
max-width: 520px;
color: #65746B;
font-size: 13px;
line-height: 1.5;
margin-bottom: 18px;
}

.hero-buttons {
display: flex;
flex-wrap: wrap;
gap: 8px;
margin-bottom: 20px;
}

.btn-primary {
border: none;
border-radius: 12px;
padding: 10px 16px;
background: var(--green);
color: white;
font-size: 11px;
font-weight: 750;
transition: .2s;
}

.btn-primary:hover {
background: var(--green-dark);
transform: translateY(-2px);
}

.btn-secondary {
border: 1px solid var(--sage-dark);
border-radius: 12px;
padding: 9px 16px;
background: white;
color: var(--green);
font-size: 11px;
font-weight: 750;
}

.social-links {
display: flex;
align-items: center;
gap: 10px;
}

.social-icon-btn {
display: inline-flex;
align-items: center;
justify-content: center;
width: 36px;
height: 36px;
border-radius: 50%;
background: white;
color: var(--green);
border: 1px solid var(--sage-dark);
font-size: 15px;
transition: all 0.25s ease;
text-decoration: none;
}

.social-icon-btn:hover {
background: var(--green);
color: white;
border-color: var(--green);
transform: translateY(-2px);
}

.hero-visual {
position: relative;
overflow: hidden;
border-radius: 24px;
min-height: 320px;
background:
linear-gradient(rgba(27,77,46,.05), rgba(27,77,46,.05)),
url("https://images.unsplash.com/photo-1556228720-195a672e8a03?auto=format&fit=crop&w=1000&q=85")
center / cover;
}

.hero-card {
position: absolute;
left: 16px;
bottom: 16px;
max-width: 230px;
padding: 12px;
border-radius: 14px;
background: rgba(255,255,255,.93);
backdrop-filter: blur(10px);
box-shadow: var(--shadow);
}

.hero-card-title {
color: var(--green);
font-size: 12px;
font-weight: 800;
margin-bottom: 2px;
}

.hero-card-text {
color: var(--muted);
font-size: 9px;
}

/* =========================================================
CATEGORY BAR
========================================================= */

.category-section {
padding: 12px 0 35px;
}

.section-heading {
display: flex;
align-items: center;
justify-content: space-between;
gap: 15px;
margin-bottom: 15px;
}

.section-heading h2 {
color: var(--green);
font-size: 21px;
letter-spacing: -.5px;
}

.section-heading p {
color: var(--muted);
font-size: 11px;
}

.category-scroll {
overflow-x: auto;
scrollbar-width: none;
}

.category-scroll::-webkit-scrollbar {
display: none;
}

.category-list {
display: flex;
gap: 10px;
min-width: max-content;
}

.category-btn {
padding: 10px 18px;
border: 1px solid var(--sage-dark);
border-radius: 25px;
background: white;
color: var(--green);
font-size: 12px;
font-weight: 700;
transition: .2s;
}

.category-btn:hover,
.category-btn.active {
background: var(--green);
border-color: var(--green);
color: white;
}

/* =========================================================
SALE
========================================================= */

.sale-section {
margin-bottom: 45px;
padding: 28px;
border-radius: 28px;
color: white;
background:
radial-gradient(circle at 100% 0%, rgba(113,179,64,.35), transparent 30%),
linear-gradient(135deg, var(--green), var(--green-dark));
box-shadow: 0 15px 35px rgba(27,77,46,.15);
}

.sale-top {
display: flex;
align-items: center;
justify-content: space-between;
gap: 15px;
margin-bottom: 20px;
}

.sale-title {
display: flex;
align-items: center;
flex-wrap: wrap;
gap: 10px;
}

.sale-pill {
padding: 5px 10px;
border-radius: 12px;
background: var(--sale);
font-size: 9px;
font-weight: 850;
letter-spacing: .5px;
}

.sale-title h2 {
font-size: 21px;
}

.countdown {
display: flex;
align-items: center;
gap: 5px;
padding: 8px 12px;
border-radius: 12px;
background: rgba(255,255,255,.11);
font-size: 10px;
font-weight: 700;
}

.time-box {
min-width: 27px;
padding: 3px 5px;
border-radius: 6px;
background: var(--sale);
text-align: center;
font-size: 11px;
}

/* =========================================================
PRODUCT SECTIONS
========================================================= */

.products-section {
margin-bottom: 45px;
}

.products-track {
display: grid;
grid-template-columns: repeat(4, minmax(0, 1fr));
gap: 16px;
}

.product-card {
position: relative;
min-width: 0;
overflow: hidden;
padding: 13px;
border: 1px solid rgba(27,77,46,.05);
border-radius: 19px;
background: white;
box-shadow: 0 5px 18px rgba(0,0,0,.035);
transition: .25s;
}

.product-card:hover {
transform: translateY(-4px);
box-shadow: var(--shadow);
}

.product-image {
position: relative;
height: 210px;
overflow: hidden;
border-radius: 14px;
background: #F4F6F3;
margin-bottom: 12px;
display: grid;
place-items: center;
}

.product-image img {
width: 100%;
height: 100%;
object-fit: cover;
transition: .3s;
}

.product-card:hover .product-image img {
transform: scale(1.04);
}

.product-wishlist {
position: absolute;
z-index: 3;
top: 9px;
right: 9px;
width: 32px;
height: 32px;
border: none;
border-radius: 50%;
background: rgba(255,255,255,.92);
display: grid;
place-items: center;
font-size: 14px;
box-shadow: 0 3px 10px rgba(0,0,0,.08);
}

.product-badge {
position: absolute;
top: 9px;
left: 9px;
padding: 5px 8px;
border-radius: 8px;
background: var(--sale);
color: white;
font-size: 9px;
font-weight: 850;
}

.product-category {
color: var(--green-light);
font-size: 9px;
font-weight: 800;
text-transform: uppercase;
margin-bottom: 4px;
}

.product-name {
color: var(--green);
font-size: 14px;
font-weight: 750;
line-height: 1.25;
margin-bottom: 6px;
min-height: 35px;
}

.product-rating {
color: var(--gold);
font-size: 10px;
margin-bottom: 9px;
}

.product-rating span {
color: var(--muted);
margin-left: 4px;
}

.product-price {
display: flex;
align-items: center;
gap: 8px;
margin-bottom: 12px;
}

.current-price {
color: var(--green);
font-size: 16px;
font-weight: 850;
}

.old-price {
color: #9BA59F;
font-size: 11px;
text-decoration: line-through;
}

.add-btn {
width: 100%;
padding: 10px;
border: none;
border-radius: 12px;
background: var(--green);
color: white;
font-size: 11px;
font-weight: 750;
transition: .2s;
}

.add-btn:hover {
background: var(--green-dark);
}

const countdownEl = document.querySelector(".countdown");
if (remainingMs <= 0) {
if (countdownEl) countdownEl.style.display = "none";
clearInterval(window.countdownTimer);
return;
}
const totalSeconds = Math.floor(remainingMs / 1000);
const hours = Math.floor(totalSeconds / 3600);
const minutes = Math.floor((totalSeconds % 3600) / 60);
const seconds = totalSeconds % 60;

document.getElementById("hours").textContent = String(hours).padStart(2, "0");
document.getElementById("minutes").textContent = String(minutes).padStart(2, "0");
document.getElementById("seconds").textContent = String(seconds).padStart(2, "0");
}

// Initial renders and data fetching
renderCategories();
renderProducts();
renderBlog();
renderFaq();
updateCart();
updateCountdown();
window.countdownTimer = setInterval(updateCountdown, 1000);

// Fetch live items from Supabase database on load
fetchProductsFromSupabase();

document.addEventListener("keydown", event => {
if (event.key !== "Escape") return;
document.querySelectorAll(".modal.active").forEach(modal => {
modal.classList.remove("active");
});
document.body.classList.remove("modal-open");
});
</script>

</body>
</html>
