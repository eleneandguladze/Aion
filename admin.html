<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aion — Admin Panel</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
--green: #1B4D2E;
--cream: #F8F6F0;
--border: #E5EAE5;
--white: #FFFFFF;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
body { background: var(--cream); color: #26382E; padding: 30px; }
.container { max-width: 600px; margin: 0 auto; background: var(--white); padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
h1 { color: var(--green); margin-bottom: 20px; font-size: 22px; }
.form-group { margin-bottom: 15px; }
label { display: block; margin-bottom: 5px; font-weight: 700; font-size: 12px; color: var(--green); }
input, textarea { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 10px; font-size: 13px; outline: none; background: var(--cream); }
input:focus, textarea:focus { background: white; border-color: var(--green); }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
.checkbox-row { margin: 15px 0; }
.checkbox-row label { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; }
.checkbox-row input { width: auto; }
button { background: var(--green); color: white; border: none; padding: 12px 20px; border-radius: 12px; font-weight: 700; cursor: pointer; width: 100%; font-size: 14px; }
button:hover { opacity: 0.9; }
.toast { margin-top: 15px; padding: 10px; border-radius: 8px; text-align: center; font-size: 12px; font-weight: 700; display: none; }
.toast.success { background: #d4edda; color: #155724; display: block; }
.toast.error { background: #f8d7da; color: #721c24; display: block; }
</style>
</head>
<body>

<div class="container">
<h1>🌿 ახალი პროდუქტის დამატება</h1>
<form id="addProductForm" onsubmit="addNewProduct(event)">
<div class="form-group">
<label>პროდუქტის დასახელება (title)</label>
<input id="prodTitle" required placeholder="მაგ: ვიტამინი D3">
</div>

<div class="row">
<div class="form-group">
<label>ფასი (price)</label>
<input id="prodPrice" type="number" step="0.01" required placeholder="29.99">
</div>
<div class="form-group">
<label>ფოტოს ლინკი (image_url)</label>
<input id="prodImage" required placeholder="https://...">
</div>
</div>

<div class="form-group">
<label>აღწერა (description)</label>
<textarea id="prodDesc" rows="3" placeholder="პროდუქტის მოკლე აღწერა..."></textarea>
</div>

<div class="checkbox-row">
<label><input id="prodStock" type="checkbox" checked> არის მარაგში (in_stock)</label>
</div>

<button type="submit">პროდუქტის დამატება ბაზაში</button>
</form>
<div id="formToast" class="toast"></div>
</div>

<script>
const SUPABASE_URL = 'https://psuitrjbsdnbqonjotax.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_ES56Aa8Rt_HByTkUSHj6iA_CqRwO4I8';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function addNewProduct(event) {
event.preventDefault();
const toast = document.getElementById("formToast");

const newProduct = {
title: document.getElementById("prodTitle").value.trim(),
price: parseFloat(document.getElementById("prodPrice").value),
description: document.getElementById("prodDesc").value.trim(),
image_url: document.getElementById("prodImage").value.trim(),
in_stock: document.getElementById("prodStock").checked
};

const { data, error } = await supabaseClient.from('products').insert([newProduct]);

if (error) {
toast.className = "toast error";
toast.textContent = "შეცდომა: " + error.message;
} else {
toast.className = "toast success";
toast.textContent = "პროდუქტი წარმატებით დაემატა! 🎉";
document.getElementById("addProductForm").reset();
}
}
</script>

</body>
</html>
