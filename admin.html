<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aion — Admin Panel</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root{
    --green:#1B4D2E;
    --dark:#10351F;
    --light:#71B340;
    --sage:#E9EFE9;
    --cream:#F8F6F0;
    --white:#fff;
    --border:#E1E7E1;
    --text:#26382E;
    --muted:#7A887D;
    --red:#D93636;
    --orange:#E88918;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
    background:var(--cream);
    color:var(--text);
    min-height:100vh;
}

/* =========================
   HEADER
========================= */

.admin-header{
    background:var(--green);
    color:white;
    padding:18px 24px;
    position:sticky;
    top:0;
    z-index:100;
    box-shadow:0 5px 20px rgba(0,0,0,.12);
}

.header-inner{
    max-width:1250px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.logo{
    font-size:24px;
    font-weight:900;
    letter-spacing:.5px;
}

.logo span{
    color:#B8D6B8;
}

.header-label{
    font-size:13px;
    opacity:.8;
}

/* =========================
   MAIN
========================= */

.container{
    max-width:1250px;
    margin:30px auto;
    padding:0 20px;
}

/* =========================
   TOP BAR
========================= */

.top-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    margin-bottom:25px;
}

.page-title h1{
    color:var(--green);
    font-size:28px;
    margin-bottom:5px;
}

.page-title p{
    color:var(--muted);
    font-size:14px;
}

.stats{
    display:flex;
    gap:10px;
}

.stat{
    background:white;
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px 18px;
    min-width:100px;
    text-align:center;
}

.stat strong{
    display:block;
    font-size:20px;
    color:var(--green);
}

.stat span{
    font-size:11px;
    color:var(--muted);
}

/* =========================
   LAYOUT
========================= */

.dashboard{
    display:grid;
    grid-template-columns:380px 1fr;
    gap:25px;
    align-items:start;
}

/* =========================
   CARD
========================= */

.card{
    background:white;
    border:1px solid var(--border);
    border-radius:20px;
    box-shadow:0 8px 25px rgba(0,0,0,.04);
}

.card-header{
    padding:20px 22px;
    border-bottom:1px solid var(--border);
}

.card-header h2{
    color:var(--green);
    font-size:18px;
}

.card-header p{
    font-size:12px;
    color:var(--muted);
    margin-top:4px;
}

.card-body{
    padding:22px;
}

/* =========================
   FORM
========================= */

.form-group{
    margin-bottom:15px;
}

label{
    display:block;
    margin-bottom:6px;
    font-weight:700;
    font-size:12px;
    color:var(--green);
}

input,
textarea,
select{
    width:100%;
    padding:11px 12px;
    border:1px solid var(--border);
    border-radius:10px;
    font-size:14px;
    outline:none;
    background:#FAFCFA;
    color:var(--text);
}

input:focus,
textarea:focus,
select:focus{
    border-color:var(--green);
    background:white;
    box-shadow:0 0 0 3px rgba(27,77,46,.08);
}

textarea{
    resize:vertical;
    min-height:90px;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

/* =========================
   IMAGE UPLOAD
========================= */

.image-preview{
    width:100%;
    height:150px;
    border:2px dashed var(--border);
    border-radius:14px;
    margin-top:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    background:var(--cream);
    color:var(--muted);
    font-size:12px;
}

.image-preview img{
    width:100%;
    height:100%;
    object-fit:contain;
}

/* =========================
   CHECKBOXES
========================= */

.check-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin:15px 0;
}

.check{
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px;
    background:#FAFCFA;
}

.check label{
    margin:0;
    display:flex;
    align-items:center;
    gap:8px;
    cursor:pointer;
}

.check input{
    width:auto;
}

/* =========================
   BUTTONS
========================= */

button{
    border:0;
    cursor:pointer;
    border-radius:11px;
    font-weight:700;
    transition:.2s;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.btn-primary{
    width:100%;
    background:var(--green);
    color:white;
    padding:13px 18px;
    font-size:14px;
}

.btn-primary:hover{
    background:var(--dark);
}

.btn-secondary{
    width:100%;
    background:var(--sage);
    color:var(--green);
    padding:12px;
    margin-top:10px;
}

.btn-danger{
    background:#FBE8E8;
    color:var(--red);
    padding:8px 11px;
}

.btn-edit{
    background:#EAF2EB;
    color:var(--green);
    padding:8px 11px;
}

/* =========================
   SEARCH
========================= */

.products-toolbar{
    padding:18px 22px;
    border-bottom:1px solid var(--border);
    display:flex;
    gap:12px;
    align-items:center;
}

.search-box{
    position:relative;
    flex:1;
}

.search-box i{
    position:absolute;
    left:13px;
    top:50%;
    transform:translateY(-50%);
    color:var(--muted);
}

.search-box input{
    padding-left:38px;
}

/* =========================
   PRODUCTS
========================= */

.products-list{
    padding:20px;
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.product-card{
    border:1px solid var(--border);
    border-radius:16px;
    padding:14px;
    display:flex;
    gap:14px;
    background:white;
}

.product-image{
    width:100px;
    height:110px;
    flex-shrink:0;
    border-radius:12px;
    background:var(--cream);
    overflow:hidden;
}

.product-image img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.product-info{
    flex:1;
    min-width:0;
}

.product-info h3{
    font-size:14px;
    color:var(--green);
    margin-bottom:5px;
}

.product-category{
    font-size:11px;
    color:var(--muted);
    margin-bottom:7px;
}

.price{
    font-weight:800;
    font-size:15px;
}

.old-price{
    text-decoration:line-through;
    color:#999;
    font-size:12px;
    margin-left:5px;
}

.badges{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
    margin-top:7px;
}

.badge{
    font-size:9px;
    padding:4px 7px;
    border-radius:20px;
    background:var(--sage);
    color:var(--green);
    font-weight:700;
}

.badge.sale{
    background:#FBE3E3;
    color:#C62828;
}

.badge.out{
    background:#eee;
    color:#777;
}

.product-actions{
    display:flex;
    gap:6px;
    margin-top:10px;
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;
    right:20px;
    bottom:20px;
    z-index:9999;
    padding:14px 18px;
    border-radius:12px;
    color:white;
    font-size:13px;
    font-weight:700;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
    transform:translateY(20px);
    opacity:0;
    pointer-events:none;
    transition:.25s;
}

.toast.show{
    transform:translateY(0);
    opacity:1;
}

.toast.success{
    background:var(--green);
}

.toast.error{
    background:var(--red);
}

/* =========================
   EMPTY
========================= */

.empty{
    padding:50px 20px;
    text-align:center;
    color:var(--muted);
}

.empty i{
    font-size:40px;
    margin-bottom:12px;
    opacity:.4;
}

/* =========================
   LOADING
========================= */

.loading{
    padding:50px;
    text-align:center;
    color:var(--muted);
}

.loading i{
    font-size:25px;
    margin-bottom:10px;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:1000px){

    .dashboard{
        grid-template-columns:1fr;
    }

    .products-list{
        grid-template-columns:1fr 1fr;
    }

}

@media(max-width:700px){

    body{
        padding-bottom:20px;
    }

    .admin-header{
        padding:15px;
    }

    .header-inner{
        flex-direction:column;
        align-items:flex-start;
        gap:4px;
    }

    .container{
        margin-top:20px;
        padding:0 12px;
    }

    .top-bar{
        flex-direction:column;
        align-items:flex-start;
    }

    .stats{
        width:100%;
    }

    .stat{
        flex:1;
    }

    .products-list{
        grid-template-columns:1fr;
        padding:12px;
    }

    .row{
        grid-template-columns:1fr;
    }

}

@media(max-width:430px){

    .card-body{
        padding:16px;
    }

    .products-toolbar{
        padding:14px;
    }

    .product-card{
        padding:10px;
    }

    .product-image{
        width:80px;
        height:90px;
    }

}

</style>
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header class="admin-header">

<div class="header-inner">

<div>
<div class="logo">Aion<span>.</span></div>
<div class="header-label">Food Supplements — Admin Panel</div>
</div>

<div class="header-label">
<i class="fa-solid fa-database"></i>
&nbsp; Supabase
</div>

</div>

</header>


<main class="container">

<!-- =========================
     TOP
========================= -->

<div class="top-bar">

<div class="page-title">
<h1>პროდუქტების მართვა</h1>
<p>დაამატე და მართე Aion-ის პროდუქტები</p>
</div>

<div class="stats">

<div class="stat">
<strong id="totalProducts">0</strong>
<span>პროდუქტი</span>
</div>

<div class="stat">
<strong id="saleProducts">0</strong>
<span>Sale</span>
</div>

<div class="stat">
<strong id="stockProducts">0</strong>
<span>მარაგში</span>
</div>

</div>

</div>


<div class="dashboard">


<!-- =========================
     ADD / EDIT PRODUCT
========================= -->

<div class="card">

<div class="card-header">

<h2 id="formTitle">
<i class="fa-solid fa-plus"></i>
&nbsp; ახალი პროდუქტი
</h2>

<p>შეავსე პროდუქტის ინფორმაცია</p>

</div>


<div class="card-body">

<form id="productForm">

<input type="hidden" id="productId">


<div class="form-group">

<label>პროდუქტის დასახელება</label>

<input
id="prodTitle"
required
placeholder="მაგ: Vitamin D3 5000 IU"
>

</div>


<div class="row">

<div class="form-group">

<label>ფასი ₾</label>

<input
id="prodPrice"
type="number"
step="0.01"
min="0"
required
placeholder="29.99"
>

</div>


<div class="form-group">

<label>ძველი ფასი ₾</label>

<input
id="prodOldPrice"
type="number"
step="0.01"
min="0"
placeholder="39.99"
>

</div>

</div>


<div class="row">

<div class="form-group">

<label>კატეგორია</label>

<select id="prodCategory">

<option value="vitamins">ვიტამინები</option>
<option value="collagen">კოლაგენი</option>
<option value="probiotics">პრობლიოტიკები</option>
<option value="minerals">მინერალები</option>
<option value="wellness">Wellness</option>

</select>

</div>


<div class="form-group">

<label>ფასდაკლება %</label>

<input
id="prodDiscount"
type="number"
min="0"
max="100"
placeholder="20"
>

</div>

</div>


<div class="form-group">

<label>პროდუქტის აღწერა</label>

<textarea
id="prodDesc"
placeholder="პროდუქტის მოკლე აღწერა..."
></textarea>

</div>


<div class="form-group">

<label>პროდუქტის ფოტო</label>

<input
id="prodImageFile"
type="file"
accept="image/*"
>

<div class="image-preview" id="imagePreview">

<i class="fa-solid fa-image"></i>
&nbsp; ფოტო ჯერ არ არის არჩეული

</div>

</div>


<div class="check-grid">

<div class="check">

<label>

<input
id="prodStock"
type="checkbox"
checked
>

მარაგშია

</label>

</div>


<div class="check">

<label>

<input
id="prodPopular"
type="checkbox"
>

პოპულარული

</label>

</div>


<div class="check">

<label>

<input
id="prodSale"
type="checkbox"
>

Sale

</label>

</div>

</div>


<button
type="submit"
class="btn-primary"
id="submitBtn"
>

<i class="fa-solid fa-plus"></i>
&nbsp; პროდუქტის დამატება

</button>


<button
type="button"
class="btn-secondary"
id="cancelEditBtn"
style="display:none"
onclick="cancelEdit()"
>

რედაქტირების გაუქმება

</button>


</form>

</div>

</div>


<!-- =========================
     PRODUCTS
========================= -->

<div class="card">

<div class="card-header">

<h2
